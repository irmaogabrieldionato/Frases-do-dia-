name: Gerar APK Meu Dia (Android)

on:
  push:
    branches:
      - meu-dia-android
    paths:
      - 'MeuDiaAndroid/**'
      - '.github/workflows/build-meu-dia.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Usar Android SDK do GitHub e instalar API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar aplicativo nativo
        run: gradle -p MeuDiaAndroid :app:assembleDebug --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MeuDia-Android-APK
          path: MeuDiaAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
