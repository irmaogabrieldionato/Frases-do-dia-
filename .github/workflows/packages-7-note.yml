name: 7-Note - Pacotes Android, TV Box, iOS e Windows
on:
  workflow_dispatch:
  push:
    branches: [7-note-musical-game]
    paths:
      - '.github/workflows/packages-7-note.yml'
      - 'native/**'
      - 'scripts/**'
      - 'app.js'
      - 'index.html'
      - 'styles.css'
      - 'game-core.js'
      - 'tv.css'
      - 'privacy.html'
      - 'sw.js'
      - 'tests/**'
permissions:
  contents: read
jobs:
  validate:
    name: Validar código compartilhado
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes de regras, segurança e arquivos
        run: npm test
      - name: Verificar sintaxe do JavaScript
        run: |
          node --check app.js
          node --check native/windows/main.cjs
      - name: Sincronizar conteúdo e gerar ícones
        run: |
          node scripts/sync-native.mjs
          python3 scripts/artwork.py
      - name: Confirmar recursos em cada plataforma
        run: |
          test -f native/android/app/src/main/assets/index.html
          test -f native/android/app/src/main/assets/privacy.html
          test -f native/ios/SevenNote/Resources/Web/index.html
          test -f native/ios/SevenNote/Resources/Web/privacy.html
          test -f native/windows/web/index.html
          test -f native/windows/web/privacy.html

  android:
    name: Android 36 e TV 35 - APK e AAB
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK 36
        shell: bash
        run: |
          set -e
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Preparar recursos locais
        run: |
          node scripts/sync-native.mjs
          python3 scripts/artwork.py
      - name: Compilar e executar Android Lint
        working-directory: native/android
        shell: bash
        run: |
          # Maven Central pode responder 429 temporariamente ao baixar dependências.
          # Repetir a compilação completa sem ocultar falhas persistentes de build/lint.
          for attempt in 1 2 3; do
            if gradle :app:assembleMobileDebug :app:assembleTvDebug :app:bundleMobileRelease :app:bundleTvRelease :app:lintMobileRelease :app:lintTvRelease --no-daemon --stacktrace; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle falhou após três tentativas; verificar log completo."
              exit 1
            fi
            echo "::warning::Gradle falhou na tentativa $attempt; aguardando antes de repetir."
            sleep $((attempt * 45))
          done
      - name: Exibir os problemas do Android Lint quando houver falha
        if: failure()
        shell: bash
        run: |
          find native/android/app/build -name 'lint-results-*.txt' -type f -print -exec sed -n '1,160p' {} \; || true
      - name: Guardar relatórios do Android Lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 7-note-Android-lint-reports
          path: native/android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Auditar API, recursos e bibliotecas nativas dos APKs
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for flavor in mobile tv; do
            APK="native/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
            test -s "$APK"
            unzip -l "$APK" | grep -F 'assets/game-core.js'
            unzip -l "$APK" | grep -F 'assets/privacy.html'
            if unzip -Z1 "$APK" | grep -E '[.]so$'; then
              echo "Bibliotecas nativas encontradas: auditar alinhamento 16 KB"
              exit 1
            fi
            "$AAPT" dump badging "$APK" > "/tmp/$flavor-badging.txt"
            grep -E 'package:|sdkVersion|targetSdkVersion' "/tmp/$flavor-badging.txt"
          done
          grep -F "targetSdkVersion:'36'" /tmp/mobile-badging.txt
          grep -F "targetSdkVersion:'35'" /tmp/tv-badging.txt
          # Verificar a integridade de cada APK antes de distribuir o artefato.
          for flavor in mobile tv; do
            unzip -t "native/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk" >/dev/null
          done
          # Auditar o conteúdo real dos dois bundles, não apenas seu tamanho.
          for flavor in mobile tv; do
            BUNDLE="native/android/app/build/outputs/bundle/${flavor}Release/app-${flavor}-release.aab"
            test -s "$BUNDLE"
            unzip -t "$BUNDLE" >/dev/null
            unzip -Z1 "$BUNDLE" | grep -Fx 'base/assets/game-core.js'
            unzip -Z1 "$BUNDLE" | grep -Fx 'base/assets/privacy.html'
            unzip -Z1 "$BUNDLE" | grep -Fx 'base/manifest/AndroidManifest.xml'
            sha256sum "$BUNDLE"
            sha256sum "native/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk"
          done
          # Criar um manifesto portátil: nomes simples, sem caminhos do runner.
          # Os quatro nomes são distintos e podem ser verificados após baixar os ZIPs.
          mkdir -p native/android/checksums
          for flavor in mobile tv; do
            cp "native/android/app/build/outputs/apk/$flavor/debug/app-$flavor-debug.apk" native/android/checksums/
            cp "native/android/app/build/outputs/bundle/${flavor}Release/app-$flavor-release.aab" native/android/checksums/
          done
          (
            cd native/android/checksums
            sha256sum app-mobile-debug.apk app-tv-debug.apk app-mobile-release.aab app-tv-release.aab > SHA256SUMS.txt
            sha256sum --check --strict SHA256SUMS.txt
          )
          # Exercitar também o verificador distribuído com os binários reais do build.
          node scripts/verify-android-packages.cjs native/android/checksums
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-Android-TV-SHA256
          path: native/android/checksums/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-Android-APK-debug
          path: native/android/app/build/outputs/apk/mobile/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-TV-Box-APK-debug
          path: native/android/app/build/outputs/apk/tv/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-Android-AAB-unsigned
          path: native/android/app/build/outputs/bundle/mobileRelease/*.aab
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-TV-Box-AAB-unsigned
          path: native/android/app/build/outputs/bundle/tvRelease/*.aab
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS - simulador e app sem assinatura
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerador de projeto Xcode
        run: brew install xcodegen
      - name: Preparar recursos offline
        run: |
          node scripts/sync-native.mjs
          python3 scripts/artwork.py
      - name: Gerar projeto Xcode
        working-directory: native/ios
        run: xcodegen generate
      - name: Compilar iOS simulador
        working-directory: native/ios
        run: xcodebuild -project SevenNote.xcodeproj -scheme SevenNote -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Verificar SDK iOS e recursos embutidos
        run: |
          APP=native/ios/build/Build/Products/Release-iphonesimulator/SevenNote.app
          test -f "$APP/Web/index.html"
          test -f "$APP/Web/game-core.js"
          test -f "$APP/Web/privacy.html"
          xcodebuild -version
          VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK $VERSION"
          SDK_VERSION="$VERSION" python3 -c 'import os; assert int(os.environ["SDK_VERSION"].split(".")[0]) >= 26, "App Store exige iOS SDK 26+"'
      - name: Empacotar simulador
        run: |
          mkdir -p native/ios/artifacts
          ditto -c -k --sequesterRsrc --keepParent native/ios/build/Build/Products/Release-iphonesimulator/SevenNote.app native/ios/artifacts/7-Note-iOS-Simulator.zip
      - name: Compilar app iOS sem assinatura
        working-directory: native/ios
        run: xcodebuild -project SevenNote.xcodeproj -scheme SevenNote -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Empacotar iOS sem assinatura
        run: ditto -c -k --sequesterRsrc --keepParent native/ios/build/Build/Products/Release-iphoneos/SevenNote.app native/ios/artifacts/7-Note-iOS-Device-UNSIGNED.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-iOS-Simulator
          path: native/ios/artifacts/7-Note-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-iOS-Device-UNSIGNED
          path: native/ios/artifacts/7-Note-iOS-Device-UNSIGNED.zip
          if-no-files-found: error
          retention-days: 30

  windows:
    name: Windows - instalador e portátil EXE
    needs: validate
    runs-on: windows-2025
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar arquivos e ícone
        shell: pwsh
        run: |
          node scripts/sync-native.mjs
          python scripts/artwork.py
      - name: Instalar dependências
        run: npm install --prefix native/windows --no-audit --no-fund
      - name: Auditar vulnerabilidades das dependências
        run: npm audit --prefix native/windows --audit-level=high
      - name: Compilar Windows x64
        run: npm run build --prefix native/windows
      - name: Conferir EXEs
        shell: pwsh
        run: |
          $files = @(Get-ChildItem native/windows/dist/*.exe)
          if ($files.Count -lt 2) { throw "Instalador ou portátil ausente" }
          $files | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-Windows-x64-EXE
          path: native/windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30
