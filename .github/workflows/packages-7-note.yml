      - name: Gerar pacote de app físico para assinatura posterior
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            native/ios/build/Build/Products/Release-iphoneos/SevenNote.app \
            native/ios/artifacts/7-Note-iOS-Device-UNSIGNED.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 7-note-iOS-Simulator
          path: native/ios/artifacts/7-Note-iOS-Simulator.zip
