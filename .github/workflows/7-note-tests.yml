name: Testes 7-Note Musical Game
on:
  push:
    branches: [7-note-musical-game]
  pull_request:
    branches: [7-note-musical-game]
jobs:
  regras:
    name: Regras e integridade da PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar as regras de jogo
        run: npm test
  navegador:
    name: Testes reais no Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-audit --no-fund
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Testar jogabilidade no navegador
        run: npm run test:browser

  pacote:
    name: Gerar ZIP do jogo para download
    needs: [regras, navegador]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Empacotar apenas os arquivos do jogo
        run: |
          mkdir -p dist
          zip -j dist/7-note-musical-game.zip index.html styles.css game-core.js app.js manifest.webmanifest icon.svg sw.js README-7-NOTE.md
      - name: Disponibilizar jogo como artefato
        uses: actions/upload-artifact@v4
        with:
          name: 7-note-musical-game
          path: dist/7-note-musical-game.zip
          if-no-files-found: error
          retention-days: 30
