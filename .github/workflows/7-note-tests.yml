name: Testes 7-Note Musical Game
on:
  push:
    branches: [7-note-musical-game]
  pull_request:
    branches: [7-note-musical-game]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rodar testes
        run: npm test
