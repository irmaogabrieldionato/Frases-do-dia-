name: Testes 7-Note Musical Game
on:
  push:
    branches: [7-note-musical-game]
  pull_request:
    branches: [7-note-musical-game]
jobs:
  regras:
    name: Regras e integridade da PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar as regras de jogo
        run: npm test
  navegador:
    name: Testes reais no Chromium
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Playwright
        run: npm install --no-audit --no-fund
      - name: Instalar navegador
        run: npx playwright install --with-deps chromium
      - name: Testar jogabilidade no navegador
        run: npm run test:browser
