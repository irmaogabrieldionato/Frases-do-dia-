name: Gerar APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verificar Android SDK existente
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: FraseDeFilosofos-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
