name: Checklist Orbis Android emulator
on:
  push:
    branches: [checklist-orbis]
    paths:
      - 'ChecklistOrbisAndroid/**'
      - '.github/workflows/checklist-orbis-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore-regression:
    if: github.ref == 'refs/heads/checklist-orbis'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install compile SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Run recovery regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: gradle -p ChecklistOrbisAndroid :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.orbis.meudia.RestoreStartupTest --stacktrace
      - name: Upload instrumented results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checklist-orbis-restore-emulator-results
          path: |
            ChecklistOrbisAndroid/app/build/outputs/androidTest-results/
            ChecklistOrbisAndroid/app/build/reports/androidTests/
          if-no-files-found: warn
