name: SevenNote
options:
  bundleIdPrefix: com.orbis
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SevenNote:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: SevenNote/SevenNoteApp.swift
      - path: SevenNote/GameView.swift
      - path: SevenNote/Resources/Web
        type: folder
        buildPhase: resources
      - path: SevenNote/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orbis.sevennote
        MARKETING_VERSION: "1.4.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "7-Note Musical Game"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
